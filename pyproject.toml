[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "EFieldView"
version = "0.1.0"
description = "Simple visualization of an eletric field generated by N point charges"
authors = [{ name = "Rafael Amorim", email = "rafael.science.amorim@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
dependencies = ["numpy", "matplotlib", "typing"]

[project.urls]
"Homepage" = "https://github.com/OffworldAstronaut/EFieldView"
